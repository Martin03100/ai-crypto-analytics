# Render's free plan puts the backend to sleep after ~15 minutes without traffic,
# so the first request afterwards takes ~50 s. Pinging the health endpoint keeps it awake.
name: Keep backend warm

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping health endpoint
        run: |
          curl --fail --silent --show-error --max-time 90 --retry 2 --retry-delay 10 \
            https://ai-crypto-analytics.onrender.com/api/health
