# Weekly database backup, stored outside the hosting provider.
#
# Needs two repository secrets (Settings -> Secrets and variables -> Actions):
#   BACKUP_DATABASE_URL  the database's EXTERNAL connection string (postgresql://...)
#   BACKUP_PASSPHRASE    a long random passphrase; keep a copy somewhere safe, without it the backup cannot be opened
# The repository is public, so the file is always encrypted (AES-256) and nothing from the database reaches the log.
# Decrypt:  openssl enc -d -aes-256-cbc -pbkdf2 -iter 600000 -in backup.json.gz.enc -out backup.json.gz
# Restore:  see "Backup and restore" in the README.
name: Database backup

on:
  schedule:
    - cron: "17 3 * * 1"      # Mondays 03:17 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: ${{ secrets.BACKUP_DATABASE_URL }}
      BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
      # The app refuses to start without these; the backup only reads rows, so placeholders are enough.
      JWT_SECRET_KEY: backup-workflow-placeholder-not-used-for-anything
      API_KEY_ENCRYPTION_SECRET: backup-workflow-placeholder-not-used-for-anything
      SCHEDULER_ENABLED: "0"
    steps:
      - name: Check that the secrets are set
        id: check
        run: |
          if [ -z "$DATABASE_URL" ] || [ -z "$BACKUP_PASSPHRASE" ]; then
            echo "::warning::BACKUP_DATABASE_URL or BACKUP_PASSPHRASE is not set; no backup was made."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v7
        if: steps.check.outputs.ready == 'true'
      - uses: actions/setup-python@v7
        if: steps.check.outputs.ready == 'true'
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Dump and encrypt
        if: steps.check.outputs.ready == 'true'
        working-directory: backend
        run: |
          pip install -q -r requirements.txt
          python -m app.services.backup dump "$RUNNER_TEMP/backup.json.gz"
          openssl enc -aes-256-cbc -pbkdf2 -iter 600000 -salt -pass env:BACKUP_PASSPHRASE \
            -in "$RUNNER_TEMP/backup.json.gz" -out "$RUNNER_TEMP/backup.json.gz.enc"
          rm "$RUNNER_TEMP/backup.json.gz"
      - uses: actions/upload-artifact@v7
        if: steps.check.outputs.ready == 'true'
        with:
          name: database-backup-${{ github.run_number }}
          path: ${{ runner.temp }}/backup.json.gz.enc
          retention-days: 90
          if-no-files-found: error
