# Build
[build]
  # npm ci installs exactly the lockfile; no install scripts are needed any more (Vite 8 ships prebuilt binaries).
  command = "npm ci && npm run build"
  publish = "dist"

# Security headers
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self' https://challenges.cloudflare.com https://cloud.umami.is https://accounts.google.com/gsi/client; style-src 'self' 'unsafe-inline' https://accounts.google.com/gsi/style; font-src 'self'; img-src 'self' data:; connect-src 'self' https://challenges.cloudflare.com https://accounts.google.com/gsi/ https://cloud.umami.is https://api-gateway.umami.dev https://*.ingest.sentry.io https://*.ingest.de.sentry.io https://*.ingest.us.sentry.io; frame-src https://challenges.cloudflare.com https://accounts.google.com/gsi/; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=(), payment=(), usb=()"
    Strict-Transport-Security = "max-age=63072000; includeSubDomains"

# Static asset caching
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Service worker and manifest must always be revalidated, or clients could stay on an old version.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/manifest.json"
  [headers.values]
    Cache-Control = "no-cache"

# API proxy to the backend. `signed` adds an x-nf-sign JWT made with the API_SIGNATURE_TOKEN site variable; the backend
# (PROXY_SIGNATURE_SECRET, same value) refuses requests without it, so nobody can call it directly and fake their IP.
# These rules live here, not in _redirects, because only netlify.toml supports `signed`.
[[redirects]]
  from = "/api/*"
  to = "https://ai-crypto-analytics.onrender.com/api/:splat"
  status = 200
  force = true
  signed = "API_SIGNATURE_TOKEN"

# Single-page app: every other path is rendered by the app (unknown ones show its "page not found" page).
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
