[build]
  command = "npm install --dangerously-allow-all-scripts && npm run build"
  publish = "dist"

# Presmerovania (API proxy + SPA fallback) su teraz v public/_redirects,
# NIE tu. Netlify subor _redirects vyhodnocuje PRED pravidlami v tomto
# subore - ak by tu boli oba naraz, tieto by sa aj tak ignorovali, co by
# mohlo byt zavadzajuce pri buducej uprave. Uprav teda backend URL v
# frontend/public/_redirects, nie tu.
